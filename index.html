<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>薄记 · 轻轻记下</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mono.css">
  <link rel="stylesheet" href="typography.css">
  <link rel="stylesheet" href="energy.css">
  <link rel="stylesheet" href="pixel-font.css">
  <link rel="stylesheet" href="pixel.css">
</head>
<body>
  <aside class="studio">
    <a class="brand" href="./"><span>薄记</span></a>
    <p class="intro">轻一点，记久一点。</p>
    <div class="studio-heading">界面</div>
    <nav class="scenes" aria-label="原型场景">
      <button data-scene="today" class="active">记录</button>
      <button data-scene="meal">记饮食</button>
      <button data-scene="workout">记训练</button>
      <button data-scene="review">回顾</button>
      <button data-scene="library">我的</button>
      <button data-scene="profile">个人信息</button>
    </nav>
    <div class="studio-heading minor">状态预览</div>
    <div class="state-switches"><button data-state="normal" class="selected">有记录</button><button data-state="empty">空白一天</button><button data-state="offline">离线</button></div>
    <div class="studio-heading minor">AI 状态演示</div>
    <div class="state-switches"><button data-ai-demo="ready">识别结果</button><button data-ai-demo="failed">识别失败</button></div>
    <div class="studio-heading minor">外观</div><div class="state-switches"><button data-theme="light" class="selected">浅色</button><button data-theme="dark">深色</button></div>
    <a class="spec-link" href="energy-spec.html" target="_blank">热量功能设计说明</a>
    <footer>v0.6 · 黑白像素版<br>AI 为演示，未调用接口；记录保存在本机。</footer>
  </aside>

  <main class="stage">
    <div class="stage-top"><span>薄记</span><span>v0.6 / PIXEL EDITION</span></div>
    <div class="phone" id="phone">
      <div class="statusbar" aria-hidden="true"><strong>9:41</strong><span class="island"></span><span class="device-status">▂▄▆ <svg viewBox="0 0 24 14"><path d="M2 4Q12-3 22 4M5 7Q12 2 19 7M9 10Q12 8 15 10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="1"/></svg><span class="battery"></span></span></div>
      <div id="app" class="app"></div>
      <div id="overlay" class="overlay" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    <div class="stage-bottom">可点击原型 <span>393 × 852</span></div>
  </main>

  <aside class="annotation">
    <h1 id="note-title">少一点。<br>刚刚好。</h1>
    <p id="note-description">留下照片和事实，其余交给日后的自己。</p>
    <div class="try-note"><span>试一试</span><p id="try-copy">记一餐，或记一组。</p></div>
  </aside>
  <script src="app.js"></script>
  <script src="redesign.js"></script>
  <script src="energy.js"></script>
  <script src="pixel.js"></script>
</body>
</html>
